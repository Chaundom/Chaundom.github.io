<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บไซต์ของฉัน</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f7f9fa;
      padding: 40px 20px;
    }
    .profile-card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    /* กำหนดขนาดและตกแต่งรูป */
    .profile-img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <h1>ยินดีต้อนรับสู่เว็บของฉัน</h1>
    
    <!-- เปลี่ยน 'my-photo.jpg' เป็นชื่อไฟล์รูปที่คุณอัปโหลดขึ้น GitHub -->
    <img src="my-photo.jpg" alt="รูปโปรไฟล์ของฉัน" class="profile-img">

    <p>นี่คือรูปภาพที่ฉันใส่ไว้ในเว็บไซต์!</p>
  </div>

</body>
</html>
