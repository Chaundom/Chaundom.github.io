<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รูปภาพของฉัน</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f9fa;
      padding: 16px;          /* เผื่อขอบไว้เล็กน้อย ไม่ให้รูปชิดขอบจอ */
      box-sizing: border-box;
    }
    img {
      max-width: 65vw;        /* กว้างไม่เกิน 85% ของหน้าจอ */
      max-height: 65vh;       /* สูงไม่เกิน 85% ของหน้าจอ (จะไม่ล้นแนวตั้งแน่นอน) */
      width: auto;
      height: auto;
      object-fit: contain;    /* รักษาสัดส่วนรูปภาพเดิมไว้ */
      display: block;
    }
  </style>
</head>
<body>

  <img src="BACK-eND dEVELOPER.png" alt="รูปโปรไฟล์ของฉัน">

</body>
</html>
